name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Cancel superseded runs on the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Expo SDK 54 / React Native 0.81 require Node 20+. The previous workflow
  # pinned Node 18, which cannot install or build this project.
  NODE_VERSION: '20'

jobs:
  verify:
    name: Lint, types and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run type-check

      # This step previously ran `npm test` with no such script defined and no
      # Jest installed, so the job always failed and every downstream build was
      # skipped. The clinical engine has a coverage floor enforced in jest.config.js.
      - name: Test
        run: npm run test:ci

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        continue-on-error: true
        with:
          files: ./coverage/lcov.info
          flags: unittests
          token: ${{ secrets.CODECOV_TOKEN }}

  release-readiness:
    name: Release readiness
    runs-on: ubuntu-latest
    needs: verify
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # Fails the build if a production secret is still a placeholder, or if any
      # dosing rule is still unreviewed. See scripts/check-release-readiness.mjs.
      - name: Check release readiness
        run: node scripts/check-release-readiness.mjs
        env:
          EXPO_PUBLIC_SENTRY_DSN: ${{ secrets.EXPO_PUBLIC_SENTRY_DSN }}
          EXPO_PUBLIC_REVENUECAT_IOS_KEY: ${{ secrets.EXPO_PUBLIC_REVENUECAT_IOS_KEY }}
          EXPO_PUBLIC_REVENUECAT_ANDROID_KEY: ${{ secrets.EXPO_PUBLIC_REVENUECAT_ANDROID_KEY }}
          EXPO_PUBLIC_ADMOB_BANNER_IOS: ${{ secrets.EXPO_PUBLIC_ADMOB_BANNER_IOS }}
          EXPO_PUBLIC_ADMOB_BANNER_ANDROID: ${{ secrets.EXPO_PUBLIC_ADMOB_BANNER_ANDROID }}
          EXPO_PUBLIC_ADMOB_INTERSTITIAL_IOS: ${{ secrets.EXPO_PUBLIC_ADMOB_INTERSTITIAL_IOS }}
          EXPO_PUBLIC_ADMOB_INTERSTITIAL_ANDROID: ${{ secrets.EXPO_PUBLIC_ADMOB_INTERSTITIAL_ANDROID }}
          EXPO_PUBLIC_ADMOB_APPOPEN_IOS: ${{ secrets.EXPO_PUBLIC_ADMOB_APPOPEN_IOS }}
          EXPO_PUBLIC_ADMOB_APPOPEN_ANDROID: ${{ secrets.EXPO_PUBLIC_ADMOB_APPOPEN_ANDROID }}

  build:
    name: EAS build (${{ matrix.platform }})
    runs-on: ubuntu-latest
    needs: release-readiness
    if: github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        platform: [android, ios]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # Both platforms build on EAS servers, so no macOS runner is needed for iOS.
      - name: Build
        run: eas build --platform ${{ matrix.platform }} --profile production --non-interactive --no-wait

  security:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # Report but do not block: most advisories here are in build-time tooling
      # that never ships in the app bundle. Review the output on every run.
      - name: npm audit
        run: npm audit --audit-level=high
        continue-on-error: true
