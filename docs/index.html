<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dozu Hesapla — Yasal Belgeler</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #ffffff;
        --fg: #1a1f26;
        --muted: #5b6472;
        --line: #e3e7ec;
        --accent: #2563eb;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #14181d;
          --fg: #e8ecf1;
          --muted: #9aa4b2;
          --line: #2a313a;
          --accent: #7aa7ff;
        }
      }
      body {
        margin: 0;
        padding: 48px 20px;
        background: var(--bg);
        color: var(--fg);
        font:
          16px/1.65 -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          Roboto,
          sans-serif;
      }
      main {
        max-width: 640px;
        margin: 0 auto;
      }
      h1 {
        font-size: 26px;
        margin: 0 0 6px;
      }
      p {
        color: var(--muted);
        margin: 0 0 24px;
      }
      ul {
        list-style: none;
        padding: 0;
        margin: 0;
      }
      li {
        border-top: 1px solid var(--line);
      }
      li:last-child {
        border-bottom: 1px solid var(--line);
      }
      a {
        display: block;
        padding: 14px 2px;
        color: var(--accent);
        text-decoration: none;
        font-weight: 600;
      }
      a:hover {
        text-decoration: underline;
      }
      footer {
        margin-top: 40px;
        color: var(--muted);
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Dozu Hesapla</h1>
      <p>Yasal belgeler · Legal documents</p>
      <ul>
        <li><a href="./privacy.html">Gizlilik Politikası (Türkçe)</a></li>
        <li><a href="./privacy-en.html">Privacy Policy (English)</a></li>
        <li><a href="./terms.html">Kullanım Şartları (Terms of Use)</a></li>
      </ul>
      <footer>
        Dozu Hesapla bir tıbbi cihaz değildir; sağlık profesyonellerine yardımcı
        bir araçtır.
      </footer>
    </main>
  </body>
</html>
